services:
  db:
    image: postgres:16-alpine
    container_name: techledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: techledger_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - techledger_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d techledger_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  techledger_postgres_data:
