{% extends 'base/base.html' %}

{% block title %}404 - Page Not Found - TechLedger Solutions{% endblock %}

{% block content %}
<section class="error-page">
    <div class="container">
        <div class="error-page__content">
            <h1 class="error-page__code">404</h1>
            <h2 class="error-page__title">Page Not Found</h2>
            <p class="error-page__description">
                Sorry, the page you are looking for does not exist or has been moved.
            </p>
            <div class="error-page__actions">
                <a href="{% url 'home:index' %}" class="btn btn--primary">Go to Homepage</a>
                <a href="{% url 'contact:index' %}" class="btn btn--secondary">Contact Us</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
