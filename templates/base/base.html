{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}TechLedger Solutions builds digital systems for institutions in Sierra Leone — management platforms, health and surveillance systems, and reporting dashboards.{% endblock %}">
    <title>{% block title %}TechLedger Solutions{% endblock %}</title>

    <link rel="icon" type="image/png" href="{% static 'images/icon.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="site-body">
    <a class="site-skip" href="#main">Skip to content</a>

    {% include 'base/header.html' %}

    <main id="main">
        {% block content %}{% endblock %}
    </main>

    {% include 'base/footer.html' %}

    <script src="{% static 'js/site.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
